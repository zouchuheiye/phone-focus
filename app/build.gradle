plugins { id 'com.android.application' }
android {
    namespace 'com.phonefocus.guard'
    compileSdk 36
    defaultConfig {
        applicationId 'com.phonefocus.guard'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.4.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PHONEFOCUS_KEYSTORE') ?: '../.local/phone-focus-release.jks')
            storePassword System.getenv('PHONEFOCUS_SIGNING_PASSWORD')
            keyAlias 'phonefocus'
            keyPassword System.getenv('PHONEFOCUS_SIGNING_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Bundled Chinese + Latin OCR: works offline, no Play Services download required.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
