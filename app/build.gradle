plugins { id 'com.android.application' }
android {
    namespace 'com.phonefocus.guard'
    compileSdk 36
    defaultConfig {
        applicationId 'com.phonefocus.guard'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.6.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PHONEFOCUS_KEYSTORE') ?: '../.local/phone-focus-release.jks')
            storePassword System.getenv('PHONEFOCUS_SIGNING_PASSWORD')
            keyAlias 'phonefocus'
            keyPassword System.getenv('PHONEFOCUS_SIGNING_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.all { systemProperty 'phonefocus.agnes.live', System.getProperty('phonefocus.agnes.live','false') } }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
